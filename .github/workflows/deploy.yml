name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: TQTuyen/ci-cd-toolkit/.github/workflows/cd-db-migrate.yml@main
    with:
      package-manager: npm
      node-version: '24'
      migration-command: migration:run
      seed-command: seed:run
    secrets:
      database-url: ${{ secrets.DATABASE_URL }}

  deploy:
    needs: migrate
    permissions:
      contents: read
      id-token: write
    uses: TQTuyen/ci-cd-toolkit/.github/workflows/cd-deploy-cloud-run.yml@main
    with:
      service: sfinx-backend
      image: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sfinx/sfinx-backend:latest
      region: asia-southeast1
      project-id: ${{ vars.GCP_PROJECT_ID }}
      flags: --allow-unauthenticated
    secrets:
      wif-provider: ${{ secrets.GCP_WIF_PROVIDER }}
      service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
